<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>REMNANT App Prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* VOICE: a quiet editorial marketplace — gallery white, black type, small caps labels
   IDEA: a pop-up book; every space unfolds from paper pieces and folds back for the next brand
   PICTURE: isometric paper dioramas rising from an open book; product renders drawn from the same model
   COLOUR and TYPE: off-white #F6F5F2, card #ECEBE7, ink #111, Inter; skins bring the only colour
   LAYOUT: one app, two shells — 1280 web frame or 390 phone frame, switched with container queries */
:root{--bg:#F6F5F2;--card:#ECEBE7;--ink:#111;--mut:#77746F;--line:#DEDCD6;--white:#fff;--acc:#111}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:#D9D7D2;color:var(--ink);font:13px/1.45 Inter,system-ui,sans-serif;overflow-x:clip}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
/* presenter bar */
.pres{position:sticky;top:0;z-index:20;display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:10px 16px;background:#111;color:#fff}
.pres b{font-weight:800;letter-spacing:.02em;margin-right:6px}
.tg{display:flex;border:1px solid #555;border-radius:999px;overflow:hidden}
.tg button{border:0;background:none;color:#bbb;padding:6px 14px;font-size:12px;font-weight:600;min-height:32px}
.tg button.on{background:#fff;color:#111}
.jump{display:flex;gap:4px;flex-wrap:wrap}
.jump button{border:1px solid #444;background:none;color:#ddd;border-radius:999px;padding:4px 10px;font-size:11px}
.jump button.on{border-color:#fff;color:#fff}
.stagewrap{display:flex;justify-content:center;padding:24px 12px 40px}
.dev{background:var(--bg);overflow:hidden;position:relative;box-shadow:0 30px 70px -25px rgba(0,0,0,.4)}
.dev.web{width:1280px;height:820px;border-radius:12px;transform-origin:top center}
.dev.mob{width:390px;height:844px;border:10px solid #111;border-radius:46px}
.app{container-type:inline-size;height:100%;display:flex;flex-direction:column;position:relative}
.scroll{flex:1;overflow-y:auto;overflow-x:hidden}
/* nav */
.nav{display:flex;align-items:center;gap:26px;padding:0 32px;height:58px;border-bottom:1px solid var(--line);background:var(--bg);flex:none}
.logo{font-weight:800;font-size:17px;letter-spacing:-.01em;border:0;background:none;padding:0}
.nav .links{display:flex;gap:22px;flex:1;justify-content:center}
.nav .links button{border:0;background:none;font-size:10.5px;font-weight:600;letter-spacing:.06em;color:#444;padding:6px 0;border-bottom:1.5px solid transparent}
.nav .links button.on{color:#111;border-color:#111}
.srch{display:flex;align-items:center;gap:6px;background:var(--card);border-radius:999px;padding:0 12px;height:30px;width:190px}
.si{width:14px;height:14px;flex:none;stroke:#555;fill:none;stroke-width:2;stroke-linecap:round}
.srch input{border:0;background:none;outline:0;width:100%;font-size:11.5px}
.ic{border:0;background:none;width:30px;height:30px;display:grid;place-items:center;position:relative;padding:0}
.ic svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.badge{position:absolute;top:1px;right:0;background:#111;color:#fff;font-size:9px;font-weight:700;min-width:15px;height:15px;border-radius:8px;display:grid;place-items:center;padding:0 3px}
.mtop{display:none}
.tabs{display:none}
/* common */
.pg{padding:28px 32px 40px;max-width:1280px;margin:0 auto}
.eyebrow{font-size:9.5px;font-weight:600;letter-spacing:.08em;color:var(--mut);text-transform:uppercase}
h1{font-size:34px;line-height:1.05;margin:4px 0 6px;letter-spacing:-.02em}
h2{font-size:22px;margin:2px 0 4px;letter-spacing:-.01em}
.sub{color:var(--mut);font-size:12.5px;margin:0}
.btn{border:0;background:#111;color:#fff;font-size:11px;font-weight:700;letter-spacing:.04em;padding:0 16px;height:38px;border-radius:4px;display:inline-flex;align-items:center;gap:8px;white-space:nowrap}
.btn.o{background:#fff;color:#111;border:1px solid #111}
.btn.s{height:30px;font-size:10.5px;padding:0 11px}
.btn:disabled{opacity:.35;cursor:default}
.chip{border:0;background:var(--card);border-radius:999px;padding:6px 12px;font-size:11px;font-weight:500;white-space:nowrap}
.chip.on{background:#111;color:#fff}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.hr{height:1px;background:var(--line);margin:22px 0}
.panel{background:var(--card);border-radius:6px;padding:14px}
.lbl{font-size:9.5px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;margin:0 0 8px}
.kv{font-size:11.5px;color:#333;line-height:1.55}
.big{font-size:22px;font-weight:800;letter-spacing:-.01em}
.small{font-size:10.5px;color:var(--mut)}
.toast{position:absolute;left:50%;bottom:24px;transform:translateX(-50%);background:#111;color:#fff;font-size:12px;font-weight:600;padding:8px 14px;border-radius:999px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:30;white-space:nowrap}
.toast.show{opacity:1}
/* home */
.hero{display:grid;grid-template-columns:300px 1fr;gap:28px;align-items:center}
.issue{background:#fff;border-radius:8px;padding:10px 14px;margin-top:18px;max-width:250px}
.issue b{font-size:11px;letter-spacing:.04em}
.book{position:relative;background:#fff;border-radius:8px;aspect-ratio:16/9.4;overflow:hidden}
.book svg{position:absolute;inset:0;width:100%;height:100%}
.hot{position:absolute;transform:translate(-50%,-100%);background:#fff;border:0;border-radius:999px;padding:4px 10px;font-size:9.5px;font-weight:700;letter-spacing:.05em;box-shadow:0 2px 8px rgba(0,0,0,.15);white-space:nowrap}
.hot:hover{background:#111;color:#fff}
.bk-nav{position:absolute;bottom:12px;left:12px;right:12px;display:flex;justify-content:space-between;pointer-events:none}
.bk-nav button{pointer-events:auto;width:32px;height:32px;border-radius:50%;border:0;background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.15);font-weight:700}
.arch{position:absolute;top:12px;right:16px;font-size:9.5px;font-weight:700;letter-spacing:.07em}
.dotsP{display:flex;gap:6px;justify-content:center;margin-top:8px;font-size:10.5px;align-items:center}
.dotsP i{width:6px;height:6px;border-radius:50%;background:#ccc}.dotsP i.on{background:#111}
.grid4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.pc{background:none;border:0;padding:0;text-align:left;cursor:pointer}
.pc .im{background:var(--card);border-radius:6px;aspect-ratio:1/.82;position:relative;display:grid;place-items:center;overflow:hidden}
.pc .im svg{width:78%;height:78%}
.av{position:absolute;top:8px;left:8px;background:#fff;border-radius:999px;font-size:8.5px;font-weight:700;letter-spacing:.05em;padding:3px 8px}
.hrt{position:absolute;top:6px;right:6px;border:0;background:none;width:26px;height:26px;display:grid;place-items:center}
.hrt svg{width:15px;height:15px;stroke:#111;fill:none;stroke-width:1.7}
.hrt.on svg{fill:#111}
.pc .cat{font-size:8.5px;font-weight:700;letter-spacing:.07em;color:var(--mut);margin-top:9px}
.pc .nm{font-size:12px;font-weight:700;margin-top:1px}
.pc .dm{font-size:10px;color:var(--mut)}
.pc .pr{display:flex;justify-content:space-between;align-items:baseline;margin-top:5px}
.pc .pr b{font-size:14px}.pc .pr span{font-size:8.5px;font-weight:700;letter-spacing:.06em;color:var(--mut)}
.steps4{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.steps4 div{border-top:1.5px solid #111;padding-top:10px}
.steps4 b{display:block;font-size:12px;margin-bottom:3px}
.foot{display:flex;justify-content:space-between;font-size:10px;color:var(--mut);border-top:1px solid var(--line);padding-top:14px;margin-top:30px}
/* materials */
.mlayout{display:grid;grid-template-columns:210px 1fr;gap:26px}
.filters .grp{margin-bottom:18px}
.filters label{display:flex;gap:8px;align-items:center;font-size:12px;padding:3px 0;cursor:pointer}
.filters input[type=checkbox]{accent-color:#111}
.filters input[type=range]{width:100%;accent-color:#111}
.toolbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;gap:10px}
.toolbar select{border:1px solid var(--line);background:#fff;border-radius:4px;height:30px;font-size:11.5px;padding:0 8px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.empty{padding:40px;text-align:center;color:var(--mut);background:var(--card);border-radius:6px}
/* item */
.ilayout{display:grid;grid-template-columns:1.15fr 1fr;gap:34px}
.gal{background:var(--card);border-radius:8px;aspect-ratio:1/.85;display:grid;place-items:center;position:relative}
.gal svg{width:70%;height:80%}
.thumbs{display:flex;gap:8px;margin-top:10px}
.thumbs button{width:62px;height:54px;border-radius:5px;background:var(--card);border:1.5px solid transparent;padding:4px}
.thumbs button.on{border-color:#111}
.thumbs svg{width:100%;height:100%}
.specs{display:grid;grid-template-columns:110px 1fr;gap:7px 10px;font-size:12px;margin:14px 0}
.specs dt{color:var(--mut)}.specs dd{margin:0;font-weight:500}
.pass{display:flex;gap:0;margin-top:10px}
.pass div{flex:1;border-left:1px solid var(--line);padding:4px 10px;font-size:10.5px}
.pass div:first-child{border-left:0;padding-left:0}
.pass b{display:block;font-size:11px}
.stamp{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;border:1.5px solid currentColor;font-size:8px;font-weight:800;margin-bottom:4px}
.qty{display:flex;align-items:center;border:1px solid var(--line);border-radius:4px;height:38px;background:#fff}
.qty button{border:0;background:none;width:32px;height:100%;font-size:15px}
.qty span{width:26px;text-align:center;font-weight:700}
/* reskin */
.rlayout{display:grid;grid-template-columns:1fr 300px;gap:22px}
.ba{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.ba .gal{aspect-ratio:1/.95}
.ba .tagl{position:absolute;top:10px;left:10px;font-size:9px;font-weight:700;letter-spacing:.07em;background:#fff;border-radius:999px;padding:3px 9px}
.moods{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.mood{border:1.5px solid transparent;background:#fff;border-radius:6px;padding:8px;text-align:left}
.mood.on{border-color:#111}
.mood .sw{display:flex;gap:3px;margin-bottom:6px}.mood .sw i{width:16px;height:16px;border-radius:50%}
.mood b{font-size:11px;display:block}.mood span{font-size:9.5px;color:var(--mut)}
.skinl button{display:flex;width:100%;justify-content:space-between;align-items:center;border:0;border-bottom:1px solid var(--line);background:none;padding:9px 0;text-align:left;font-size:12px}
.skinl button.on b{text-decoration:underline}
.skinl i{width:14px;height:14px;border-radius:50%;display:inline-block;margin-right:8px;vertical-align:-2px;border:1px solid rgba(0,0,0,.15)}
.bar{height:8px;background:#fff;border-radius:4px;overflow:hidden;margin:4px 0 10px}.bar i{display:block;height:100%;background:#111}
.pick{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px}
.pick button{flex:none;width:86px;border:1.5px solid transparent;background:var(--card);border-radius:6px;padding:4px;font-size:9.5px;font-weight:600}
.pick button.on{border-color:#111}
.pick svg{width:100%;height:56px}
/* planner/preview */
.wlayout{display:grid;grid-template-columns:230px 1fr 230px;gap:14px;height:540px}.wlayout>*{min-height:0}
.lib{display:flex;flex-direction:column;gap:8px;overflow:hidden}
.lib .sr{background:#fff;border-radius:4px;height:30px;display:flex;align-items:center;padding:0 10px;gap:6px}
.lib .sr input{border:0;outline:0;background:none;width:100%;font-size:11.5px}
.seg{display:flex;background:#E2E0DB;border-radius:4px;padding:2px}
.seg button{flex:1;border:0;background:none;font-size:10.5px;font-weight:600;padding:5px 0;border-radius:3px;color:#555}
.seg button.on{background:#fff;color:#111}
.lst{flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;gap:8px;padding-right:2px}
.li{display:flex;gap:10px;align-items:center;background:#fff;border-radius:5px;padding:6px;border:1.5px solid transparent;cursor:grab;touch-action:none}
.li.on{border-color:#111}
.li .tn{width:52px;height:46px;background:var(--card);border-radius:4px;flex:none}
.li .tn svg{width:100%;height:100%}
.li b{font-size:11px;display:block}.li span{font-size:9.5px;color:var(--mut);display:block}
.li .add{margin-left:auto;border:0;background:none;font-size:18px;width:26px;height:26px}
.cv{background:#fff;border-radius:6px;display:flex;flex-direction:column;overflow:hidden;position:relative}
.cvh{display:flex;justify-content:space-between;align-items:center;padding:8px 12px;border-bottom:1px solid var(--line);font-size:11px;font-weight:600}
.dim2{display:flex;background:var(--card);border-radius:3px;padding:2px}
.dim2 button{border:0;background:none;font-size:9.5px;font-weight:700;letter-spacing:.05em;padding:4px 9px;border-radius:2px}
.dim2 button.on{background:#111;color:#fff}
.cvb{flex:1;position:relative;touch-action:none}
.cvb svg{position:absolute;inset:0;width:100%;height:100%}
.cvf{display:flex;justify-content:space-between;align-items:center;padding:7px 12px;border-top:1px solid var(--line);font-size:9.5px;font-weight:600;letter-spacing:.05em;color:var(--mut)}
.cvf .ctl{display:flex;gap:2px;align-items:center;color:#111}
.cvf .ctl button{border:0;background:none;width:26px;height:24px;font-size:13px}
.cvf .ctl button:disabled{opacity:.3}
.side{min-height:0}.side .panel{display:flex;flex-direction:column;gap:10px;height:100%;overflow-y:auto}
.side .sec{border-bottom:1px solid #D6D4CE;padding-bottom:11px}
.cvhint{position:absolute;top:10px;left:12px;display:flex;gap:6px;z-index:2}
.cvhint span{background:var(--bg);border-radius:999px;font-size:9.5px;font-weight:600;padding:3px 9px}
.cvhint span.bad{background:#111;color:#fff}
.stepsF{display:flex;gap:22px;font-size:10px;font-weight:600;letter-spacing:.04em;color:var(--mut);border-top:1px solid var(--line);padding-top:12px;margin-top:16px}
.stepsF b{color:#111}
/* cart */
.clayout{display:grid;grid-template-columns:1fr 320px;gap:26px}
.cl{display:grid;grid-template-columns:70px 1fr auto;gap:14px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.cl .tn{width:70px;height:60px;background:var(--card);border-radius:5px}.cl .tn svg{width:100%;height:100%}
.cl b{font-size:12.5px}.cl .rm{border:0;background:none;font-size:10.5px;color:var(--mut);text-decoration:underline;padding:0}
.tl{display:grid;grid-template-columns:repeat(5,1fr);gap:0;margin-top:8px}
.tl div{border-top:2px solid #ccc;padding-top:6px;font-size:10.5px}
.tl div.on{border-color:#111}
.tl b{display:block;font-size:11px}
.sumr{display:flex;justify-content:space-between;font-size:12px;padding:4px 0}
/* sell */
.slayout{display:grid;grid-template-columns:1fr 1fr;gap:26px}
.drop{border:1.5px dashed #aaa;border-radius:8px;background:#fff;padding:26px;text-align:center;cursor:pointer;display:block}
.drop input{display:none}
.drop b{display:block;font-size:13px;margin:6px 0 2px}
.prev{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.prev img{width:72px;height:72px;object-fit:cover;border-radius:5px}
.fld{display:flex;flex-direction:column;gap:4px;margin-bottom:10px}
.fld label{font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:#444}
.fld input,.fld select{height:36px;border:1px solid var(--line);border-radius:4px;background:#fff;padding:0 10px;font-size:13px}
.fld2{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.grade{display:flex;gap:10px;align-items:center;background:#fff;border-radius:6px;padding:12px;margin-top:12px}
.grade .g{width:46px;height:46px;border-radius:50%;background:#111;color:#fff;display:grid;place-items:center;font-weight:800;font-size:17px}
.mylist{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
:focus-visible{outline:2px solid #111;outline-offset:2px}

/* ===== MOBILE (container) ===== */
@container (max-width:700px){
 .nav{display:none}
 .mtop{display:flex;align-items:center;gap:6px;padding:40px 14px 8px;background:var(--bg);border-bottom:1px solid var(--line);flex:none}
 .mtop .logo{flex:1;font-size:16px}
 .tabs{display:grid;grid-template-columns:repeat(5,1fr);border-top:1px solid var(--line);background:var(--bg);padding:6px 0 18px;flex:none}
 .tabs button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:9.5px;font-weight:600;color:#999;position:relative}
 .tabs button.on{color:#111}
 .tabs svg{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
 .tabs .badge{right:22%}
 .pg{padding:16px 14px 28px}
 h1{font-size:28px}h2{font-size:19px}
 .hero{grid-template-columns:1fr;gap:12px}
 .hero .htxt{order:2}
 .issue{max-width:none}
 .book{aspect-ratio:1/.86}
 .grid4,.grid3{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
 .steps4{grid-template-columns:1fr 1fr}
 .mlayout{grid-template-columns:1fr}
 .filters{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px}
 .filters .grp{display:contents}.filters .grp>.lbl,.filters .grp>.rng{display:none}
 .filters label{flex:none;background:var(--card);border-radius:999px;padding:5px 11px;font-size:11px}
 .filters input[type=checkbox]{display:none}
 .filters label:has(input:checked){background:#111;color:#fff}
 .ilayout,.rlayout,.clayout,.slayout{grid-template-columns:1fr;gap:16px}
 .ba{gap:8px}
 .moods{grid-template-columns:repeat(3,minmax(0,1fr))}
 .wlayout{display:flex;flex-direction:column;height:auto;gap:10px}
 .wlayout .lib{order:2}
 .wlayout .cv{order:1;height:380px}
 .wlayout .side{order:3}
 .lib .lst{flex-direction:row;overflow-x:auto;overflow-y:hidden;padding-bottom:4px}
 .li{flex:none;width:200px}
 .side .panel{height:auto;display:grid;grid-template-columns:1fr 1fr;gap:10px}
 .side .sec{border:0;padding:0}
 .side .sec.full{grid-column:1/-1}
 .stepsF{flex-wrap:wrap;gap:8px 14px}
 .tl{grid-template-columns:repeat(5,minmax(0,1fr))}.tl div{font-size:9.5px}
 .fld2{grid-template-columns:1fr 1fr 1fr}
 .mylist{grid-template-columns:1fr 1fr}
 .foot{flex-direction:column;gap:4px}
 .hide-m{display:none!important}
}
@container (min-width:701px){.only-m{display:none!important}}
@media (max-width:500px){.stagewrap{padding:0}.dev.mob{border:0;border-radius:0;width:100%;height:100dvh}.pres .jump{display:none}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
 <symbol id="i-s" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></symbol>
 <symbol id="i-h" viewBox="0 0 24 24"><path d="M12 20s-7-4.4-7-10a4 4 0 017-2.6A4 4 0 0119 10c0 5.6-7 10-7 10z"/></symbol>
 <symbol id="i-c" viewBox="0 0 24 24"><path d="M5 7h14l-1.5 12h-11zM9 7V5a3 3 0 016 0v2"/></symbol>
 <symbol id="i-book" viewBox="0 0 24 24"><path d="M3 5h7a2 2 0 012 2v13a2 2 0 00-2-2H3zM21 5h-7a2 2 0 00-2 2v13a2 2 0 012-2h7z"/></symbol>
 <symbol id="i-grid" viewBox="0 0 24 24"><path d="M4 4h7v7H4zM13 4h7v7h-7zM4 13h7v7H4zM13 13h7v7h-7z"/></symbol>
 <symbol id="i-plan" viewBox="0 0 24 24"><path d="M12 3l9 5-9 5-9-5zM3 13l9 5 9-5"/></symbol>
 <symbol id="i-tag" viewBox="0 0 24 24"><path d="M3 12V3h9l9 9-9 9zM7.5 7.5h.01"/></symbol>
</svg>
<div class="pres">
  <b>REMNANT*</b>
  <div class="tg" id="devTg"><button data-d="web" class="on">Web</button><button data-d="mob">Mobile</button></div>
  <div class="jump" id="jump"></div>
</div>
<div class="stagewrap" id="stagewrap"><div class="dev web" id="dev"><div class="app" id="app"></div></div></div>

<script>
{
// ================= DATA =================
const ROOM={W:5,D:4,H:2.8};

const shade=(h,f)=>{const n=parseInt(h.slice(1),16);const r=Math.round((n>>16&255)*f),g=Math.round((n>>8&255)*f),b=Math.round((n&255)*f);return '#'+((1<<24)+(r<<16)+(g<<8)+b).toString(16).slice(1);};
const pts=a=>a.map(p=>p[0].toFixed(1)+','+p[1].toFixed(1)).join(' ');
function faces(P,x0,x1,y0,y1,z0,z1,col,o={}){const s=o.stroke||'rgba(40,30,20,.35)',sw=o.sw??.6,op=o.op?` fill-opacity="${o.op}"`:'';
 return `<polygon points="${pts([P(x1,y0,z0),P(x1,y0,z1),P(x1,y1,z1),P(x1,y1,z0)])}" fill="${shade(col,o.r??.8)}"${op} stroke="${s}" stroke-width="${sw}" stroke-linejoin="round"/><polygon points="${pts([P(x0,y1,z0),P(x1,y1,z0),P(x1,y1,z1),P(x0,y1,z1)])}" fill="${shade(col,o.l??.92)}"${op} stroke="${s}" stroke-width="${sw}" stroke-linejoin="round"/><polygon points="${pts([P(x0,y0,z1),P(x1,y0,z1),P(x1,y1,z1),P(x0,y1,z1)])}" fill="${col}"${op} stroke="${s}" stroke-width="${sw}" stroke-linejoin="round"/>`;}
const rr=(a,b,c,d,rot,W,D)=>{const t=(x,y)=>rot===0?[x,y]:rot===1?[y,W-x]:rot===2?[W-x,D-y]:[D-y,x];const p=t(a,b),q=t(a+c,b+d);return [Math.min(p[0],q[0]),Math.min(p[1],q[1]),Math.abs(q[0]-p[0]),Math.abs(q[1]-p[1])];};
const dims=it=>{const c=CAT[it.k];return it.rot%2?{w:c.D,d:c.W}:{w:c.W,d:c.D};};
function parts(it){const c=CAT[it.k];const sk=c.skins[it.s]||c.skins[0];return c.parts(sk.c,c.W,c.D,c.H).map(p=>{const [a,b,w,d]=rr(p[0],p[1],p[3],p[4],it.rot||0,c.W,c.D);return {x:it.x+a,y:it.y+b,w,d,z:p[2],h:p[5],col:p[6]};});}
const w2v=(x,y,r,W,D)=>r===0?[x,y]:r===1?[y,W-x]:r===2?[W-x,D-y]:[D-y,x];
const v2w=(vx,vy,r,W,D)=>r===0?[vx,vy]:r===1?[W-vy,vx]:r===2?[W-vx,D-vy]:[vy,D-vx];
function thumb(k,s){const c=CAT[k];const ps=parts({k,x:0,y:0,rot:0,s});const kk=20,cc=kk*.866;const P=(x,y,z)=>[(x-y)*cc,(x+y)*kk/2-z*kk];let a=1e9,b=1e9,e=-1e9,f=-1e9;for(const p of ps)for(const [x,y,z] of [[p.x,p.y,p.z],[p.x+p.w,p.y,p.z],[p.x,p.y+p.d,p.z],[p.x+p.w,p.y+p.d,p.z],[p.x,p.y,p.z+p.h],[p.x+p.w,p.y+p.d,p.z+p.h]]){const q=P(x,y,z);a=Math.min(a,q[0]);e=Math.max(e,q[0]);b=Math.min(b,q[1]);f=Math.max(f,q[1]);}
 const sh=`<ellipse cx="${(a+e)/2}" cy="${f-2}" rx="${(e-a)*.42}" ry="${(e-a)*.08}" fill="#000" opacity=".07"/>`;
 return `<svg viewBox="${a-6} ${b-6} ${e-a+12} ${f-b+12}" aria-hidden="true">${sh}${ps.map(p=>({...p,key:p.x+p.w+p.y+p.d})).sort((x,y)=>x.key-y.key).map(p=>faces(P,p.x,p.x+p.w,p.y,p.y+p.d,p.z,p.z+p.h,p.col,{op:c.glass?.6:0})).join('')}</svg>`;}
// iso room scene
function scene(items,o){const W=o.W,D=o.D,r=o.r||0;const VW=r%2?D:W,VD=r%2?W:D;const H=o.H;const cw=o.cw,ch=o.ch;
 const k=(o.zoom||1)*Math.min((cw-o.pad*2)/((VW+VD)*.866),(ch-o.pad*2)/((VW+VD)*.5+H+(o.base||0)));const c=k*.866;const ox=(cw-(VW+VD)*c)/2+VD*c;const oy=(ch-((VW+VD)*.5+H+(o.base||0))*k)/2+H*k+(o.dy||0);const P=(x,y,z)=>[ox+(x-y)*c,oy+(x+y)*k/2-z*k];
 let h='';const t=.12;
 if(o.book){const m=1.3,bz=.22;const bx0=-m,bx1=VW+m,by0=-m*.7,by1=VD+m;h+=faces(P,bx0,bx1,by0,by1,-bz-.08,-bz,'#E7DFD0',{stroke:'rgba(80,60,40,.25)'});for(let i=0;i<4;i++)h+=`<polyline points="${pts([P(bx0,by1,-bz+i*.06),P(bx1,by1,-bz+i*.06),P(bx1,by0,-bz+i*.06)])}" fill="none" stroke="rgba(120,100,70,.35)" stroke-width=".7"/>`;h+=faces(P,bx0,bx1,by0,by1,-bz,0,'#FBF8F1',{stroke:'rgba(80,60,40,.25)'});const mx=VW/2;h+=`<line x1="${P(bx0+(bx1-bx0)/2,by0,0)[0]}" y1="${P(bx0+(bx1-bx0)/2,by0,0)[1]}" x2="${P(bx0+(bx1-bx0)/2,by1,0)[0]}" y2="${P(bx0+(bx1-bx0)/2,by1,0)[1]}" stroke="rgba(120,100,70,.35)" stroke-width="1"/>`;}
 h+=`<polygon points="${pts([P(0,0,0),P(VW,0,0),P(VW,VD,0),P(0,VD,0)])}" fill="${o.floor}" stroke="rgba(40,30,20,.3)" stroke-width=".8"/>`;
 if(o.planks){for(let i=.25;i<VW;i+=.25)h+=`<line x1="${P(i,0,0)[0]}" y1="${P(i,0,0)[1]}" x2="${P(i,VD,0)[0]}" y2="${P(i,VD,0)[1]}" stroke="rgba(120,90,50,.13)" stroke-width=".7"/>`;}
 if(o.grid){for(let i=.5;i<VW;i+=.5)h+=`<line x1="${P(i,0,0)[0]}" y1="${P(i,0,0)[1]}" x2="${P(i,VD,0)[0]}" y2="${P(i,VD,0)[1]}" stroke="rgba(0,0,0,.08)" stroke-width=".6"/>`;for(let j=.5;j<VD;j+=.5)h+=`<line x1="${P(0,j,0)[0]}" y1="${P(0,j,0)[1]}" x2="${P(VW,j,0)[0]}" y2="${P(VW,j,0)[1]}" stroke="rgba(0,0,0,.08)" stroke-width=".6"/>`;}
 h+=faces(P,-t,VW,-t,0,0,H,o.wall,{r:.86,l:.95})+faces(P,-t,0,0,VD,0,H,o.wall,{r:.86,l:.95});
 if(o.door){const dz=[[o.door[0],D-.9],[o.door[1],D-.9],[o.door[1],D],[o.door[0],D]].map(([x,y])=>{const v=w2v(x,y,r,W,D);return P(v[0],v[1],0);});h+=`<polygon points="${pts(dz)}" fill="#111" fill-opacity=".04" stroke="#111" stroke-opacity=".35" stroke-width=".8" stroke-dasharray="3 3"/>`;}
 if(o.sel){const it=items.find(i=>i.u===o.sel);if(it){const d=dims(it);const [ax,ay]=w2v(it.x,it.y,r,W,D),[bx,by]=w2v(it.x+d.w,it.y+d.d,r,W,D);const x0=Math.min(ax,bx),x1=Math.max(ax,bx),y0=Math.min(ay,by),y1=Math.max(ay,by);h+=`<polygon points="${pts([P(x0,y0,0),P(x1,y0,0),P(x1,y1,0),P(x0,y1,0)])}" fill="${o.bad?'#d00':'#111'}" fill-opacity=".08" stroke="${o.bad?'#d00':'#111'}" stroke-width="1.4" stroke-dasharray="5 3"/>`;}}
 let all=[];for(const it of items)for(const p of parts(it)){const [ax,ay]=w2v(p.x,p.y,r,W,D),[bx,by]=w2v(p.x+p.w,p.y+p.d,r,W,D);const x0=Math.min(ax,bx),x1=Math.max(ax,bx),y0=Math.min(ay,by),y1=Math.max(ay,by);all.push({u:it.u,x0,x1,y0,y1,z0:p.z,z1:p.z+p.h,col:p.col,glass:CAT[it.k].glass,key:x0+x1+y0+y1+p.z*.01});}
 all.sort((a,b)=>a.key-b.key);for(const p of all)h+=`<g ${o.drag?`data-u="${p.u}" style="cursor:grab"`:''}>${faces(P,p.x0,p.x1,p.y0,p.y1,p.z0,p.z1,p.col,{op:p.glass?.6:0})}</g>`;
 h+=faces(P,VW,VW+t,-t,VD,0,.12,o.wall,{r:.86,l:.95})+faces(P,0,VW+t,VD,VD+t,0,.12,o.wall,{r:.86,l:.95});
 const tops={};for(const it of items){const c=CAT[it.k];const d=dims(it);const [cx,cy]=w2v(it.x+d.w/2,it.y+d.d/2,r,W,D);tops[it.u??it.k]=P(cx,cy,c.H);}
 return {svg:h,P,k,c,ox,oy,tops,VW,VD};}

// ================= CHECKS =================
const hit=(a,b,m=0)=>{const A=dims(a),B=dims(b);return a.x<b.x+B.w+m-.01&&a.x+A.w+m>b.x+.01&&a.y<b.y+B.d+m-.01&&a.y+A.d+m>b.y+.01;};
const DOOR=[2.0,3.0];
function checks(){const P=S.plan;let ov=0,tight=0;for(let i=0;i<P.length;i++)for(let j=i+1;j<P.length;j++){if(hit(P[i],P[j]))ov++;else if(hit(P[i],P[j],.9))tight++;}
 const door=!P.some(it=>{const d=dims(it);return it.y+d.d>ROOM.D-.9&&it.x<DOOR[1]&&it.x+d.w>DOOR[0];});const area=P.reduce((a,it)=>{const d=dims(it);return a+d.w*d.d;},0)/(ROOM.W*ROOM.D);return {ov,tight,door,area};}
const overlaps=it=>S.plan.some(o=>o!==it&&hit(it,o));
const snap=v=>Math.round(v*10)/10;
function clampIt(it){const d=dims(it);it.x=Math.max(0,Math.min(ROOM.W-d.w,snap(it.x)));it.y=Math.max(0,Math.min(ROOM.D-d.d,snap(it.y)));}
function findFree(it){if(!overlaps(it))return;const x0=it.x,y0=it.y;for(let rad=.2;rad<4;rad+=.2)for(let a=0;a<16;a++){it.x=x0+Math.cos(a/16*Math.PI*2)*rad;it.y=y0+Math.sin(a/16*Math.PI*2)*rad;clampIt(it);if(!overlaps(it))return;}it.x=x0;it.y=y0;}
function addToPlan(k,pos){push();const it={u:uid++,k,x:0,y:0,rot:0,s:skinFor(k,S.mood)};const d=dims(it);if(pos){it.x=pos[0]-d.w/2;it.y=pos[1]-d.d/2;}else{it.x=ROOM.W/2-d.w/2;it.y=ROOM.D/2-d.d/2;}clampIt(it);S.plan.push(it);findFree(it);S.sel=it.u;toast('Added '+CAT[k].name);return it;}
// ================= CANVAS =================
let G={};
function drawWork(){const svg=$('#cvs');if(!svg)return;const cw=svg.clientWidth||600,ch=svg.clientHeight||400;svg.setAttribute('viewBox',`0 0 ${cw} ${ch}`);const sel=S.plan.find(i=>i.u===S.sel);const bad=sel&&overlaps(sel);
 if(S.route==='preview'){const sc=scene(S.plan,{W:ROOM.W,D:ROOM.D,H:1.6,cw,ch,pad:26,r:S.view,zoom:S.zoom,floor:'#E9D9BD',wall:'#F7F5F1',planks:1,door:DOOR,sel:S.sel,bad,drag:1});G={...sc,iso:1};let h=sc.svg;
  if(sel){const tp=sc.tops[sel.u];h+=`<line x1="${tp[0]}" y1="${tp[1]}" x2="${tp[0]}" y2="${tp[1]-16}" stroke="#111" stroke-width="1"/><g data-h="rot" style="cursor:pointer"><circle cx="${tp[0]}" cy="${tp[1]-26}" r="10" fill="#111"/><text x="${tp[0]}" y="${tp[1]-22}" text-anchor="middle" fill="#fff" font-size="12" font-weight="700">↻</text></g><g transform="translate(${tp[0]},${tp[1]-46})"><rect x="-58" y="-10" width="116" height="18" rx="9" fill="#fff" stroke="#111" stroke-width=".8"/><text text-anchor="middle" y="3" font-size="9" font-weight="700" letter-spacing=".05em">${esc(CAT[sel.k].name.toUpperCase().slice(0,20))}</text></g>`;}
  svg.innerHTML=h;}
 else{const pad=34;const k=Math.min((cw-pad*2)/ROOM.W,(ch-pad*2-10)/ROOM.D);const ox=(cw-ROOM.W*k)/2,oy=(ch-ROOM.D*k)/2+4;G={k,ox,oy,iso:0};let h=`<rect width="${cw}" height="${ch}" fill="#FBFAF7"/>`;
  for(let x=ox%(k/5);x<cw;x+=k/5)h+=`<line x1="${x}" y1="0" x2="${x}" y2="${ch}" stroke="rgba(0,0,0,.05)"/>`;for(let y=oy%(k/5);y<ch;y+=k/5)h+=`<line x1="0" y1="${y}" x2="${cw}" y2="${y}" stroke="rgba(0,0,0,.05)"/>`;
  h+=`<text x="14" y="18" font-size="8.5" font-weight="700" letter-spacing=".08em" fill="#999">FLOOR PLAN / 1:40</text><text x="${ox+ROOM.W*k/2}" y="${oy-12}" text-anchor="middle" font-size="9.5" fill="#666">${ROOM.W*100} cm</text><text x="${ox-14}" y="${oy+ROOM.D*k/2}" text-anchor="middle" font-size="9.5" fill="#666" transform="rotate(-90 ${ox-14} ${oy+ROOM.D*k/2})">${ROOM.D*100} cm</text>`;
  h+=`<path d="M ${ox+DOOR[0]*k} ${oy+ROOM.D*k} H ${ox} V ${oy} H ${ox+ROOM.W*k} V ${oy+ROOM.D*k} H ${ox+DOOR[1]*k}" fill="none" stroke="#7A7670" stroke-width="7"/><path d="M ${ox+DOOR[0]*k} ${oy+ROOM.D*k} V ${oy+(ROOM.D-.9)*k} A ${.9*k} ${.9*k} 0 0 1 ${ox+(DOOR[0]+.9)*k} ${oy+ROOM.D*k}" fill="none" stroke="#999" stroke-dasharray="3 3"/><text x="${ox+(DOOR[0]+.5)*k}" y="${oy+ROOM.D*k+16}" text-anchor="middle" font-size="8.5" font-weight="700" letter-spacing=".08em" fill="#666">ENTRY</text>`;
  for(const it of S.plan){const c=CAT[it.k],sk=c.skins[it.s];const d=dims(it);const x=ox+it.x*k,y=oy+it.y*k,w=d.w*k,hh=d.d*k;const on=it.u===S.sel;const tp=c.top(sk.c);const st=on?(overlaps(it)?'#d00':'#111'):'rgba(0,0,0,.25)';
   let inner='';const ix=x+3,iy=y+3,iw=w-6,ih=hh-6;if(tp.lines){const n=3;for(let i=1;i<=n;i++){if(w>hh)inner+=`<line x1="${ix}" y1="${iy+ih*i/(n+1)}" x2="${ix+iw}" y2="${iy+ih*i/(n+1)}" stroke="rgba(0,0,0,.25)"/>`;else inner+=`<line x1="${ix+iw*i/(n+1)}" y1="${iy}" x2="${ix+iw*i/(n+1)}" y2="${iy+ih}" stroke="rgba(0,0,0,.25)"/>`;}}
   if(tp.rail){if(w>hh){inner+=`<line x1="${ix}" y1="${iy+ih/2}" x2="${ix+iw}" y2="${iy+ih/2}" stroke="${tp.rail}" stroke-width="2"/>`;for(let i=0;i<6;i++)inner+=`<rect x="${ix+4+i*(iw-8)/6}" y="${iy+2}" width="${(iw-8)/6-2}" height="${ih-4}" fill="${sk.c.g[i%4]}" stroke="rgba(0,0,0,.15)"/>`;}else{inner+=`<line x1="${ix+iw/2}" y1="${iy}" x2="${ix+iw/2}" y2="${iy+ih}" stroke="${tp.rail}" stroke-width="2"/>`;for(let i=0;i<6;i++)inner+=`<rect x="${ix+2}" y="${iy+4+i*(ih-8)/6}" width="${iw-4}" height="${(ih-8)/6-2}" fill="${sk.c.g[i%4]}" stroke="rgba(0,0,0,.15)"/>`;}}
   if(tp.inset)inner+=`<rect x="${ix+4}" y="${iy+4}" width="${Math.max(0,iw-8)}" height="${Math.max(0,ih-8)}" fill="none" stroke="rgba(0,0,0,.18)"/>`;
   if(tp.arch)inner+=`<rect x="${ix}" y="${iy}" width="${w>hh?iw:6}" height="${w>hh?6:ih}" fill="${tp.arch}"/>`;
   if(tp.L)inner+=`<path d="M${ix} ${iy+4} H${ix+iw-4} V${iy+ih*.7}" fill="none" stroke="${sk.c.p}" stroke-width="5"/>`;
   h+=`<g data-u="${it.u}" style="cursor:grab"><rect x="${x}" y="${y}" width="${w}" height="${hh}" rx="2" fill="#fff" filter="url(#sh)" stroke="${st}" stroke-width="${on?1.6:.8}" ${on?'stroke-dasharray="5 3"':''}/><rect x="${ix}" y="${iy}" width="${Math.max(0,iw)}" height="${Math.max(0,ih)}" fill="${tp.fill}"/>${inner}</g>`;
   h+=`<text x="${x}" y="${y+hh+11}" font-size="8" font-weight="700" letter-spacing=".05em" fill="#555">${String(S.plan.indexOf(it)+1).padStart(2,'0')} / ${esc(c.name.toUpperCase().split(' ').slice(-2).join(' '))}</text>`;
   if(on)h+=`<g transform="translate(${x+w/2},${y-12})"><rect x="-62" y="-9" width="124" height="16" rx="8" fill="#111"/><text text-anchor="middle" y="3" font-size="8" font-weight="700" fill="#fff" letter-spacing=".06em">SELECTED / MOVE / ROTATE</text></g>`;}
  svg.innerHTML=`<defs><filter id="sh" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="2" stdDeviation="1.6" flood-opacity=".22"/></filter></defs>`+h;}
 const ch2=checks();$('#cvhint').innerHTML=`<span class="${ch2.ov?'bad':''}">${ch2.ov?ch2.ov+' overlap':'No overlap ✓'}</span><span class="${ch2.door?'':'bad'}">${ch2.door?'Entry clear ✓':'Entry blocked'}</span><span>${S.route==='preview'?[45,135,225,315][S.view]+'°':S.plan.length+' pieces'}</span>`;}
function toWorld(e){const svg=$('#cvs');const p=svg.createSVGPoint();p.x=e.clientX;p.y=e.clientY;const q=p.matrixTransform(svg.getScreenCTM().inverse());if(!G.iso)return [(q.x-G.ox)/G.k,(q.y-G.oy)/G.k];const a=(q.x-G.ox)/G.c,b=(q.y-G.oy)*2/G.k;return v2w((a+b)/2,(b-a)/2,S.view,ROOM.W,ROOM.D);}
function bindWork(){const svg=$('#cvs');if(!svg)return;let drag=null;
 svg.addEventListener('pointerdown',e=>{if(e.target.closest('[data-h]')){act('rot');return;}const g=e.target.closest('[data-u]');if(g){const it=S.plan.find(i=>i.u==g.dataset.u);S.sel=it.u;push();const w=toWorld(e);drag={it,dx:w[0]-it.x,dy:w[1]-it.y,moved:false};}else{S.sel=null;drag={sw:true,sx:e.clientX};}svg.setPointerCapture(e.pointerId);drawWork();refreshSide();});
 svg.addEventListener('pointermove',e=>{if(!drag)return;if(drag.sw){if(S.route==='preview'&&Math.abs(e.clientX-drag.sx)>70){S.view=(S.view+(e.clientX>drag.sx?3:1))%4;drag.sx=e.clientX;drawWork();}return;}const w=toWorld(e);drag.it.x=w[0]-drag.dx;drag.it.y=w[1]-drag.dy;clampIt(drag.it);drag.moved=true;drawWork();});
 svg.addEventListener('pointerup',()=>{if(drag&&drag.it){if(!drag.moved)hist.pop();else if(overlaps(drag.it))toast('Overlapping another piece');}drag=null;refreshSide();save();});
 svg.addEventListener('wheel',e=>{if(S.route!=='preview')return;e.preventDefault();S.zoom=Math.max(.7,Math.min(1.8,S.zoom*(e.deltaY<0?1.08:1/1.08)));drawWork();},{passive:false});
 // library drag
 document.querySelectorAll('.li').forEach(el=>el.addEventListener('pointerdown',e=>{if(e.target.closest('.add'))return;const k=el.dataset.lk;let moved=false;const sx=e.clientX,sy=e.clientY;el.setPointerCapture(e.pointerId);const gh=document.createElement('div');gh.className='toast show';gh.style.cssText='position:fixed;bottom:auto;left:0;top:0;transform:translate(-50%,-140%);';gh.textContent='+ '+CAT[k].name;
  el.onpointermove=ev=>{if(!moved&&Math.hypot(ev.clientX-sx,ev.clientY-sy)<8)return;if(!moved){moved=true;document.body.appendChild(gh);}gh.style.left=ev.clientX+'px';gh.style.top=ev.clientY+'px';};
  el.onpointerup=ev=>{el.onpointermove=el.onpointerup=null;gh.remove();const r=svg.getBoundingClientRect();const inside=ev.clientX>r.left&&ev.clientX<r.right&&ev.clientY>r.top&&ev.clientY<r.bottom;if(moved&&!inside)return;if(!moved){S.sel=null;}addToPlan(k,moved?toWorld(ev):null);render();};}));
 const ro=new ResizeObserver(()=>drawWork());ro.observe(svg);}
function refreshSide(){const s=document.querySelector('.side');if(s){s.outerHTML=sideHTML();}const u=$('#undo'),r=$('#redo');if(u)u.disabled=!hist.length;if(r)r.disabled=!fut.length;}
function act(a){const it=S.plan.find(i=>i.u===S.sel);if(!it)return;push();if(a==='rot'){const d0=dims(it);const cx=it.x+d0.w/2,cy=it.y+d0.d/2;it.rot=((it.rot||0)+1)%4;const d=dims(it);it.x=cx-d.w/2;it.y=cy-d.d/2;clampIt(it);}if(a==='dup'){const n={...it,u:uid++,x:it.x+.3,y:it.y+.3};clampIt(n);S.plan.push(n);findFree(n);S.sel=n.u;}if(a==='del'){S.plan=S.plan.filter(i=>i!==it);S.sel=null;toast('Peeled off. Undo with ↶');}render();}
// ================= BOOK =================
function drawBook(){const el=$('#book');if(!el)return;const items=JSON.parse(el.dataset.items);const is=ISSUES[S.issue];const r=el.getBoundingClientRect();const cw=r.width||600,ch=r.height||360;
 const sc=scene(items,{W:ROOM.W,D:ROOM.D,H:2.2,cw,ch,pad:22,r:0,floor:is.key==='mori'?'#E8D7B8':'#F6E7EC',wall:is.key==='mori'?'#F3EDE1':'#FBF1F4',planks:is.key==='mori',book:1,base:1.9,dy:-28});
 let h=`<svg viewBox="0 0 ${cw} ${ch}" aria-label="Pop-up book: ${esc(is.title)}">${sc.svg}</svg><span class="arch">ARCHIVE / ${is.no}</span>`;
 for(const [k,l] of is.tags){const idx=items.findIndex(i=>i.k===k);const tp=sc.tops['h'+idx];h+=`<button class="hot" style="left:${tp[0]/cw*100}%;top:${(tp[1]-6)/ch*100}%" data-item="${k}" data-sk="${skinFor(k,is.key)}">${l}</button>`;}
 h+=`<div class="bk-nav"><button data-iss="-1" aria-label="Previous issue">←</button><button data-iss="1" aria-label="Next issue">→</button></div>`;el.innerHTML=h;}
// ================= ROUTER / RENDER =================
const PAGES={home:pHome,materials:pMaterials,item:pItem,reskin:pReskin,planner:()=>pWork('planner'),preview:()=>pWork('preview'),cart:pCart,sell:pSell};
const JUMP=[['home','Home'],['materials','Materials'],['item','Item'],['reskin','AI Re-skin'],['planner','2D Planner'],['preview','3D Preview'],['cart','Cart'],['sell','Sell']];
let tt;function toast(m){const t=$('#toast');if(!t)return;t.textContent=m;t.classList.add('show');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('show'),1700);}
function go(r){S.route=r;const sc=$('#scroll');render();const s2=$('#scroll');if(s2)s2.scrollTop=0;try{history.replaceState(null,'','#'+r);}catch(e){}}
function render(){const keep=$('#scroll')?.scrollTop||0;app.innerHTML=shell(PAGES[S.route]());const sc=$('#scroll');if(sc)sc.scrollTop=keep;
 $('#jump').innerHTML=JUMP.map(([r,l])=>`<button data-go="${r}" class="${S.route===r?'on':''}">${l}</button>`).join('');
 document.querySelectorAll('#devTg button').forEach(b=>b.classList.toggle('on',b.dataset.d===S.dev));
 drawBook();if(S.route==='planner'||S.route==='preview'){drawWork();bindWork();}
 const so=$('#sort');if(so)so.value=S.sort;fit();save();}
// events (delegated)
document.addEventListener('click',e=>{const t=e.target.closest('button,[data-item],label');if(!t)return;const d=t.dataset;
 if(d.save){e.stopPropagation();const i=S.saved.indexOf(d.save);i<0?S.saved.push(d.save):S.saved.splice(i,1);toast(i<0?'Saved':'Removed from saved');render();return;}
 if(d.go){go(d.go);return;}
 if(d.item){S.itemK=d.item;S.itemSkin=d.sk!=null?+d.sk:CAT[d.item].skins.findIndex(x=>x.orig);go('item');return;}
 if(d.d){S.dev=d.d;setDev();return;}
 if(d.iss){S.issue=(S.issue+ +d.iss+ISSUES.length)%ISSUES.length;render();return;}
 if(d.useIssue){const is=ISSUES[S.issue];push();S.mood=is.key;S.plan=is.items.map(p=>({...p,u:uid++,s:skinFor(p.k,is.key)}));S.sel=null;go('preview');toast('Loaded '+is.title+' layout');return;}
 if(d.hf){S.filter=d.hf;render();return;}
 if(d.isk!=null){S.itemSkin=+d.isk;render();return;}
 if(d.addplan){addToPlan(d.addplan);render();return;}
 if(d.rk){S.rk=d.rk;go('reskin');return;}
 if(d.rkp){S.rk=d.rkp;render();return;}
 if(d.mood){S.mood=d.mood;render();return;}
 if(d.sk!=null&&S.route==='reskin'){const m=CAT[S.rk].skins[+d.sk].mood;if(m!=='orig')S.mood=m;render();return;}
 if(d.applyrk){const k=d.applyrk;const si=skinFor(k,S.mood);push();const ex=S.plan.filter(p=>p.k===k);if(ex.length)ex.forEach(p=>p.s=si);else addToPlan(k);S.plan.forEach(p=>{p.s=skinFor(p.k,S.mood);});go('planner');toast('Applied '+MOODS[S.mood].n+' skins');return;}
 if(d.lt){S.libTab=d.lt;render();return;}
 if(d.addk){addToPlan(d.addk);render();return;}
 if(d.act){act(d.act);return;}
 if(d.rm){S.plan=S.plan.filter(p=>p.u!=d.rm);render();return;}
 if(d.after!=null){t.parentElement.querySelectorAll('.chip').forEach(c=>c.classList.toggle('on',c===t));return;}
 if(t.id==='undo'){const p=hist.pop();if(p){fut.push(JSON.stringify(S.plan));S.plan=JSON.parse(p);render();}return;}
 if(t.id==='redo'){const p=fut.pop();if(p){hist.push(JSON.stringify(S.plan));S.plan=JSON.parse(p);render();}return;}
 if(t.id==='rl'){S.view=(S.view+3)%4;drawWork();return;}if(t.id==='rr'){S.view=(S.view+1)%4;drawWork();return;}
 if(t.id==='zi'){S.zoom=Math.min(1.8,S.zoom*1.15);render();return;}if(t.id==='zo'){S.zoom=Math.max(.7,S.zoom/1.15);render();return;}
 if(t.id==='saveP'){toast('Project saved');return;}
 if(t.id==='req'){toast('Handover requested');return;}
});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.dataset&&e.target.dataset.item){e.target.click();}
 if(!(S.route==='planner'||S.route==='preview')||e.target.tagName==='INPUT')return;if(e.key==='r'||e.key==='R')act('rot');if(e.key==='Delete'||e.key==='Backspace')act('del');if(e.key==='ArrowLeft'&&S.route==='preview'){S.view=(S.view+3)%4;drawWork();}if(e.key==='ArrowRight'&&S.route==='preview'){S.view=(S.view+1)%4;drawWork();}});
document.addEventListener('input',e=>{const t=e.target;
 if(t.id==='gq'){S.q=t.value;if(S.route!=='materials'){S.route='materials';render();const g=$('#gq');g.focus();g.setSelectionRange(g.value.length,g.value.length);}else{const v=t.value;render();const g=$('#gq');g.focus();g.setSelectionRange(v.length,v.length);}return;}
 if(t.id==='libq'){S.libQ=t.value;render();const g=$('#libq');g.focus();g.setSelectionRange(t.value.length,t.value.length);return;}
 if(t.id==='km'){S.maxKm=+t.value;render();return;}});
document.addEventListener('change',e=>{const t=e.target;
 if(t.dataset.cat){const c=t.dataset.cat;S.cats=t.checked?[...S.cats,c]:S.cats.filter(x=>x!==c);render();}
 if(t.dataset.near!==undefined&&t.matches('[data-near]')){S.maxKm=t.checked?10:20;render();}
 if(t.id==='ga'){S.gradeA=t.checked;render();}
 if(t.id==='sort'){S.sort=t.value;render();}
 if(t.id==='sc'){S.sellCat=t.value;}
 if(t.id==='ph'){const fs=[...t.files].slice(0,8);Promise.all(fs.map(f=>new Promise(res=>{const r=new FileReader();r.onload=()=>res(r.result);r.readAsDataURL(f);}))).then(us=>{S.photos=[...S.photos,...us].slice(0,8);render();toast('AI graded your photos');});}});
document.addEventListener('submit',e=>{if(e.target.id!=='sf')return;e.preventDefault();S.sold.unshift({n:$('#sn').value||'Fixture',c:$('#sc').value,q:$('#sq').value||'1',p:+$('#spr').value||0});render();toast('Listing published');});
// device frame
function setDev(){const dev=$('#dev');dev.className='dev '+(S.dev==='web'?'web':'mob');render();}
function fit(){const dev=$('#dev');if(S.dev!=='web'){dev.style.transform='';dev.style.marginBottom='';return;}const avail=$('#stagewrap').clientWidth-24;const s=Math.min(1,avail/1280);dev.style.transform=`scale(${s})`;dev.style.marginBottom=`${-(1-s)*820}px`;}
window.addEventListener('resize',()=>{fit();drawBook();});
// init
const h0=(location.hash||'').slice(1);if(PAGES[h0])S.route=h0;
if(window.innerWidth<600)S.dev='mob';
$('#dev').className='dev '+(S.dev==='web'?'web':'mob');
render();
document.fonts&&document.fonts.ready.then(()=>{drawBook();drawWork();});
}
</script>
